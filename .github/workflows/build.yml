name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
        
    - name: Setup Gradle
      run: |
        # Cria o diretório wrapper
        mkdir -p gradle/wrapper
        
        # Baixa o gradle-wrapper.jar
        wget -O gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        
        # Cria o gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Baixa o gradlew
        wget -O gradlew \
          https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
        chmod +x gradlew
        
        # Baixa o gradlew.bat
        wget -O gradlew.bat \
          https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew.bat
        
    - name: Build APK
      run: |
        ./gradlew assembleRelease
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: MeuApp-APK
        path: app/build/outputs/apk/release/
