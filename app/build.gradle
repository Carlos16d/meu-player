plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seuapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.seuapp.player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // Empacota as .so nativas
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    
    // LibreTorrent - Biblioteca torrent nativa com UDP REAL
    implementation 'com.github.proninyaroslav:libretorrent:3.6'
}
