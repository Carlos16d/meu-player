plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seuapp'
    compileSdk 33

    defaultConfig {
        applicationId "com.seuapp.player"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    packagingOptions {
        exclude 'META-INF/*'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // LibreTorrent - suporte UDP completo
    implementation 'org.libtorrent4j:libtorrent4j:2.0.8-16'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.0.8-16'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.0.8-16'
}
