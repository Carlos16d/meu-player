plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meuapp.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.meuapp.player'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libtorrent4j.so'
        pickFirst 'lib/armeabi-v7a/libtorrent4j.so'
        pickFirst 'lib/x86/libtorrent4j.so'
        pickFirst 'lib/x86_64/libtorrent4j.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Libtorrent
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-38'
    
    // ExoPlayer (Media3)
    implementation 'androidx.media3:media3-exoplayer:1.4.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.0'
    implementation 'androidx.media3:media3-ui:1.4.0'
}