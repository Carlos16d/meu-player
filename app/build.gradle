plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seuapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.seuapp.player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.frostwire:jlibtorrent:1.2.19.0'
    implementation 'com.frostwire:jlibtorrent-android-arm64:1.2.19.0'
    implementation 'com.frostwire:jlibtorrent-android-arm:1.2.19.0'
}
