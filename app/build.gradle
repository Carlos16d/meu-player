plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meuapp.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.meuapp.player'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libtorrent4j.so'
        pickFirst 'lib/armeabi-v7a/libtorrent4j.so'
        pickFirst 'lib/x86/libtorrent4j.so'
        pickFirst 'lib/x86_64/libtorrent4j.so'
        pickFirst 'lib/arm64-v8a/libvlc.so'
        pickFirst 'lib/armeabi-v7a/libvlc.so'
        pickFirst 'lib/x86/libvlc.so'
        pickFirst 'lib/x86_64/libvlc.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-38'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-38'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.videolan.android:libvlc-all:3.5.1'
}