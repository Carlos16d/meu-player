plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seuapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.seuapp.player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // LibreTorrent - biblioteca nativa com UDP REAL compilada
    implementation 'com.github.proninyaroslav:libretorrent:1.9.1'
}
