<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player Torrent UDP</title>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #111;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #6c5ce7;
        }
        
        .header h1 {
            font-size: 1.5em;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .container {
            flex: 1;
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .player-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(108, 92, 231, 0.2);
        }
        
        #torrentPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .player-placeholder {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #666;
        }
        
        .controls-panel {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .controls-panel h3 {
            color: #a855f7;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #252525;
            color: #999;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: #6c5ce7;
            color: #fff;
            font-weight: 600;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            background: #252525;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9em;
            outline: none;
            transition: border 0.3s;
        }
        
        input[type="text"]:focus { border-color: #6c5ce7; }
        input[type="file"] { display: none; }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            color: #fff;
            flex: 1;
        }
        
        .btn-secondary {
            background: #252525;
            color: #a855f7;
            border: 2px solid #6c5ce7;
            width: 100%;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            width: 100%;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-card {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.3em;
            font-weight: 700;
            color: #a855f7;
        }
        
        .stat-label {
            font-size: 0.7em;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        .progress-container {
            background: #252525;
            border-radius: 10px;
            height: 8px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #a855f7);
            border-radius: 10px;
            transition: width 0.3s;
            width: 0%;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.9em;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show { opacity: 1; }
        .toast.error { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 Player Torrent UDP</h1>
    </div>
    
    <div class="container">
        <div class="player-wrapper" id="playerWrapper">
            <video id="torrentPlayer" controls playsinline crossorigin="anonymous"></video>
            <div class="player-placeholder" id="playerPlaceholder">
                <span style="font-size:4em;opacity:0.5;">▶️</span>
                <p>Adicione um torrent para começar</p>
            </div>
        </div>
        
        <div class="stats-grid" id="statsPanel" style="display:none;">
            <div class="stat-card">
                <div class="stat-value" id="statProgress">0%</div>
                <div class="stat-label">Progresso</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statSpeed">0 KB/s</div>
                <div class="stat-label">Velocidade</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statPeers">0</div>
                <div class="stat-label">Peers</div>
            </div>
        </div>
        
        <div class="progress-container" id="progressContainer" style="display:none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="controls-panel">
            <h3>📥 Adicionar Torrent</h3>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('magnet')">🔗 Link/Magnet</button>
                <button class="tab-btn" onclick="switchTab('file')">📁 Arquivo .torrent</button>
            </div>
            
            <div class="tab-content active" id="tabMagnet">
                <div class="input-group">
                    <input type="text" id="magnetInput" placeholder="Cole o magnet link aqui...">
                </div>
                <button class="btn btn-primary" onclick="addMagnetTorrent()">▶️ Reproduzir</button>
            </div>
            
            <div class="tab-content" id="tabFile">
                <input type="file" id="fileInput" accept=".torrent" onchange="handleFileSelect(event)">
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                    📂 Selecionar Arquivo .torrent
                </button>
                <p id="fileNameDisplay" style="margin-top:10px;font-size:0.85em;color:#888;"></p>
                <button class="btn btn-primary" id="btnPlayFile" style="margin-top:15px;display:none;" onclick="playFileTorrent()">
                    ▶️ Reproduzir Arquivo
                </button>
            </div>
        </div>
        
        <button class="btn btn-danger" id="btnStop" style="display:none;" onclick="stopTorrent()">
            ⏹️ Parar Reprodução
        </button>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        let client = null;
        let currentTorrent = null;
        let selectedFile = null;
        let statsInterval = null;
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'magnet') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tabMagnet').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tabFile').classList.add('active');
            }
        }
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (isError ? 'error' : '') + ' show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        function formatSize(bytes) {
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
        }
        
        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('fileNameDisplay').textContent = 
                    '📄 ' + selectedFile.name + ' (' + formatSize(selectedFile.size) + ')';
                document.getElementById('btnPlayFile').style.display = 'block';
            }
        }
        
        function playFileTorrent() {
            if (!selectedFile) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const blob = new Blob([e.target.result]);
                const url = URL.createObjectURL(blob);
                addTorrent(url);
            };
            reader.readAsArrayBuffer(selectedFile);
        }
        
        function addMagnetTorrent() {
            const input = document.getElementById('magnetInput').value.trim();
            if (!input) {
                showToast('Cole um link magnet', true);
                return;
            }
            addTorrent(input);
        }
        
        function addTorrent(source) {
            if (!client) {
                client = new WebTorrent();
            }
            
            showToast('Conectando a peers...');
            
            // Adiciona trackers UDP (WebTorrent usa WebRTC, mas tenta UDP também)
            let magnet = source;
            if (magnet.startsWith('magnet:')) {
                const trackers = [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.btorrent.xyz',
                    'wss://tracker.files.fm:7073'
                ];
                trackers.forEach(tr => {
                    if (!magnet.includes(tr)) {
                        magnet += '&tr=' + encodeURIComponent(tr);
                    }
                });
            }
            
            client.add(magnet, (torrent) => {
                currentTorrent = torrent;
                console.log('Torrent:', torrent.name);
                
                // Pega o maior arquivo de vídeo
                const videoFile = torrent.files
                    .filter(f => /\.(mp4|mkv|avi|webm|mov)$/i.test(f.name))
                    .sort((a, b) => b.length - a.length)[0];
                
                if (videoFile) {
                    const player = document.getElementById('torrentPlayer');
                    document.getElementById('playerPlaceholder').style.display = 'none';
                    
                    // Renderiza direto no player
                    videoFile.renderTo(player, {
                        autoplay: true,
                        controls: true
                    });
                    
                    // Mostra UI
                    document.getElementById('statsPanel').style.display = 'grid';
                    document.getElementById('progressContainer').style.display = 'block';
                    document.getElementById('btnStop').style.display = 'block';
                    
                    // Atualiza bridge nativa (se disponível)
                    updateNativeBridge(torrent);
                    
                    // Inicia monitoramento
                    startStatsUpdate(torrent);
                    
                    showToast('Reproduzindo: ' + videoFile.name);
                } else {
                    showToast('Nenhum arquivo de vídeo encontrado', true);
                }
            });
        }
        
        function updateNativeBridge(torrent) {
            if (typeof AndroidTorrent !== 'undefined') {
                setInterval(() => {
                    const progress = (torrent.progress * 100).toFixed(1);
                    const peers = torrent.numPeers;
                    const speed = formatSize(torrent.downloadSpeed) + '/s';
                    
                    AndroidTorrent.updateTorrentData(progress, String(peers), speed);
                }, 1000);
            }
        }
        
        function startStatsUpdate(torrent) {
            if (statsInterval) clearInterval(statsInterval);
            
            statsInterval = setInterval(() => {
                const progress = (torrent.progress * 100).toFixed(1);
                const speed = formatSize(torrent.downloadSpeed) + '/s';
                const peers = torrent.numPeers;
                
                document.getElementById('statProgress').textContent = progress + '%';
                document.getElementById('statSpeed').textContent = speed;
                document.getElementById('statPeers').textContent = peers;
                document.getElementById('progressBar').style.width = progress + '%';
            }, 1000);
        }
        
        function stopTorrent() {
            if (currentTorrent) {
                currentTorrent.destroy();
                currentTorrent = null;
            }
            
            const player = document.getElementById('torrentPlayer');
            player.pause();
            player.removeAttribute('src');
            document.getElementById('playerPlaceholder').style.display = 'flex';
            
            if (statsInterval) clearInterval(statsInterval);
            
            document.getElementById('statsPanel').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('btnStop').style.display = 'none';
            
            showToast('Reprodução parada');
        }
        
        // Suporte a Drag & Drop
        document.addEventListener('DOMContentLoaded', () => {
            const playerWrapper = document.getElementById('playerWrapper');
            
            playerWrapper.addEventListener('dragover', (e) => {
                e.preventDefault();
                playerWrapper.style.border = '2px dashed #6c5ce7';
            });
            
            playerWrapper.addEventListener('dragleave', () => {
                playerWrapper.style.border = 'none';
            });
            
            playerWrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                playerWrapper.style.border = 'none';
                
                const file = e.dataTransfer.files[0];
                if (file && file.name.endsWith('.torrent')) {
                    selectedFile = file;
                    playFileTorrent();
                }
            });
        });
    </script>
</body>
</html>
