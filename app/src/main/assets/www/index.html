<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debug Métodos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #4ecb71; font-family: monospace; padding: 15px; min-height: 100vh; }
        h2 { color: #6c5ce7; text-align: center; margin-bottom: 15px; font-size: 1.1em; }
        button { width: 100%; padding: 14px; background: #6c5ce7; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        pre { background: #111; padding: 12px; border-radius: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; line-height: 1.5; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>🔍 Métodos da Sessão</h2>
    <button onclick="listar()">📋 Listar Métodos</button>
    <pre id="output">Aguardando...</pre>

    <script>
        function listar() {
            document.getElementById('output').textContent = App.getMethods();
        }
        setTimeout(listar, 500);
    </script>
</body>
</html>
