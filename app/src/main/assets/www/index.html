<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent UDP Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 15px; min-height: 100vh; }
        h1 { text-align: center; color: #e74c3c; margin-bottom: 20px; font-size: 1.2em; }
        video { width: 100%; background: #000; border-radius: 8px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; }
        button { width: 100%; padding: 14px; background: #e74c3c; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .stop { background: #555; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .stat { background: #1a1a1a; padding: 12px; border-radius: 8px; text-align: center; }
        .stat .v { color: #e74c3c; font-size: 18px; font-weight: bold; }
        .stat .l { color: #888; font-size: 11px; margin-top: 4px; }
        .info { background: #1a1a1a; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 12px; color: #888; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>🎬 Torrent UDP Player</h1>
    
    <video id="player" controls playsinline></video>
    
    <input type="text" id="magnetInput" placeholder="Cole o magnet link aqui...">
    <button onclick="play()">▶️ Reproduzir com UDP</button>
    <button class="stop" onclick="stop()">⏹️ Parar</button>
    
    <div class="stats">
        <div class="stat"><div class="v" id="progress">0%</div><div class="l">Progresso</div></div>
        <div class="stat"><div class="v" id="speed">0 KB/s</div><div class="l">Velocidade</div></div>
        <div class="stat"><div class="v" id="peers">0</div><div class="l">Peers UDP</div></div>
    </div>
    
    <div class="info">
        ✅ Trackers UDP ativos<br>
        ✅ DHT • LSD • UPnP<br>
        ✅ Download sequencial<br>
        ✅ Streaming enquanto baixa
    </div>

    <script>
        let interval = null;
        
        function play() {
            const magnet = document.getElementById('magnetInput').value.trim();
            if (!magnet.startsWith('magnet:')) {
                alert('Cole um magnet link!');
                return;
            }
            
            // Adiciona trackers UDP
            let m = magnet;
            const trackers = [
                'udp://tracker.opentrackr.org:1337/announce',
                'udp://tracker.openbittorrent.com:6969/announce',
                'udp://open.stealth.si:80/announce',
                'udp://tracker.torrent.eu.org:451/announce',
                'udp://explodie.org:6969/announce',
                'udp://tracker.moeking.me:6969/announce'
            ];
            trackers.forEach(tr => {
                if (!m.includes(tr)) m += '&tr=' + encodeURIComponent(tr);
            });
            
            // Envia para o motor nativo (UDP real!)
            AndroidTorrent.addTorrent(m);
            
            // Aguarda e inicia player
            setTimeout(() => {
                const url = AndroidTorrent.getStreamUrl();
                if (url) {
                    document.getElementById('player').src = url;
                    document.getElementById('player').play();
                }
            }, 5000);
            
            // Monitora stats
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                document.getElementById('progress').textContent = AndroidTorrent.getProgress() + '%';
                document.getElementById('speed').textContent = AndroidTorrent.getDownloadSpeed();
                document.getElementById('peers').textContent = AndroidTorrent.getPeers();
            }, 1000);
        }
        
        function stop() {
            AndroidTorrent.stopTorrent();
            document.getElementById('player').pause();
            document.getElementById('player').removeAttribute('src');
            if (interval) clearInterval(interval);
            document.getElementById('progress').textContent = '0%';
            document.getElementById('speed').textContent = '0 KB/s';
            document.getElementById('peers').textContent = '0';
        }
    </script>
</body>
</html>
