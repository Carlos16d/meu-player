<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torrent UDP Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding: 12px; min-height: 100vh; }
        .header { text-align: center; padding: 10px 0 15px; border-bottom: 2px solid #e74c3c; margin-bottom: 15px; }
        .header h1 { font-size: 1.2em; color: #e74c3c; }
        video { width: 100%; background: #000; border-radius: 8px; margin-bottom: 12px; aspect-ratio: 16/9; }
        textarea { width: 100%; height: 80px; padding: 10px; background: #1a1a1a; border: 2px solid #333; border-radius: 8px; color: #fff; font-size: 12px; margin-bottom: 10px; outline: none; resize: vertical; }
        textarea:focus { border-color: #e74c3c; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-play { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn-stop { background: #555; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .stat { background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; }
        .stat .v { color: #e74c3c; font-size: 17px; font-weight: bold; }
        .stat .l { color: #888; font-size: 10px; margin-top: 3px; text-transform: uppercase; }
        .log { background: #111; padding: 10px; border-radius: 8px; font-size: 11px; color: #4ecb71; max-height: 100px; overflow-y: auto; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header"><h1>🎬 UDP Torrent Player</h1></div>
    
    <video id="player" controls playsinline></video>
    
    <textarea id="magnetInput" placeholder="Cole o magnet link aqui..."></textarea>
    <button class="btn-play" onclick="play()">▶️ Baixar com UDP Nativo</button>
    <button class="btn-stop" onclick="stop()">⏹️ Parar</button>
    
    <div class="stats">
        <div class="stat"><div class="v" id="progress">0%</div><div class="l">Progresso</div></div>
        <div class="stat"><div class="v" id="speed">0 KB/s</div><div class="l">Velocidade</div></div>
        <div class="stat"><div class="v" id="peers">0</div><div class="l">Peers UDP</div></div>
    </div>
    
    <div class="log" id="log">Pronto para download UDP nativo.</div>

    <script>
        let interval = null;
        
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += '\n' + msg;
            el.scrollTop = el.scrollHeight;
        }
        
        function play() {
            const magnet = document.getElementById('magnetInput').value.trim();
            if (!magnet.startsWith('magnet:')) { log('❌ Magnet inválido!'); return; }
            
            log('📥 Iniciando download UDP nativo...');
            NativeTorrent.download(magnet);
            
            setTimeout(checkFile, 3000);
        }
        
        function checkFile() {
            const path = NativeTorrent.getFilePath();
            if (path) {
                log('✅ Arquivo encontrado! Reproduzindo...');
                document.getElementById('player').src = path;
                document.getElementById('player').play();
            } else {
                log('⏳ Aguardando download iniciar...');
                setTimeout(checkFile, 2000);
            }
            
            if (interval) clearInterval(interval);
            interval = setInterval(() => {
                document.getElementById('progress').textContent = NativeTorrent.getProgress() + '%';
                document.getElementById('speed').textContent = NativeTorrent.getSpeed();
                document.getElementById('peers').textContent = NativeTorrent.getPeers();
            }, 1000);
        }
        
        function stop() {
            NativeTorrent.stop();
            document.getElementById('player').pause();
            document.getElementById('player').removeAttribute('src');
            if (interval) clearInterval(interval);
            log('⏹️ Parado');
        }
    </script>
</body>
</html>
