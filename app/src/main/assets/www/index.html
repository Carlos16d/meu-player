<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste Servidor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding: 12px; }
        h2 { color: #4ecb71; margin-bottom: 15px; }
        video { width: 100%; background: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .info { margin-top: 15px; padding: 12px; background: #1a1a1a; border-radius: 8px; font-size: 12px; color: #4ecb71; font-family: monospace; }
    </style>
</head>
<body>
    <h2>🧪 Teste do Servidor HTTP</h2>
    
    <video id="player" controls playsinline crossorigin="anonymous"></video>
    
    <div class="info" id="info">
        Tentando conectar ao servidor...<br>
        URL: http://127.0.0.1:8080/video
    </div>

    <script>
        const player = document.getElementById('player');
        const info = document.getElementById('info');
        
        // Tenta carregar o vídeo do servidor
        player.src = 'http://127.0.0.1:8080/video';
        
        player.addEventListener('loadedmetadata', () => {
            info.textContent = '✅ Conectado ao servidor!\nDuração: ' + player.duration + 's';
        });
        
        player.addEventListener('error', (e) => {
            info.textContent = '❌ Erro ao conectar\nCódigo: ' + player.error.code + '\nMensagem: ' + player.error.message;
        });
        
        player.addEventListener('waiting', () => {
            info.textContent = '⏳ Aguardando dados...';
        });
        
        player.addEventListener('playing', () => {
            info.textContent = '▶️ Reproduzindo!';
        });
    </script>
</body>
</html>
