<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 15px; }
        button { width: 100%; padding: 14px; background: #e74c3c; border: none; border-radius: 8px; color: #fff; font-size: 15px; cursor: pointer; margin: 10px 0; }
        pre { background: #111; padding: 12px; border-radius: 8px; font-size: 11px; white-space: pre-wrap; }
        textarea { width: 100%; height: 80px; padding: 12px; background: #1a1a1a; border: 2px solid #333; border-radius: 8px; color: #fff; font-size: 12px; margin-bottom: 10px; outline: none; }
    </style>
</head>
<body>
    <h2>Métodos torrent_handle</h2>
    <textarea id="magnet" placeholder="Cole o magnet aqui..."></textarea>
    <button onclick="baixarEVer()">Baixar e Ver Métodos</button>
    <pre id="output">Aguardando...</pre>
    <script>
        function baixarEVer() {
            const m = document.getElementById('magnet').value.trim();
            if (m.startsWith('magnet:')) {
                App.startDownload(m);
                setTimeout(() => {
                    document.getElementById('output').textContent = App.getTorrentMethods();
                }, 5000);
            }
        }
    </script>
</body>
</html>
