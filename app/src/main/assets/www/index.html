<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UDP Streaming Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; }
        .header { text-align: center; padding: 15px 0; border-bottom: 2px solid #e74c3c; margin-bottom: 15px; }
        .header h1 { font-size: 1.3em; color: #e74c3c; }
        
        /* Player container */
        .player-wrapper { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Tela de carregamento */
        .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.5s; }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #e74c3c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-info { text-align: center; padding: 0 20px; }
        .loading-info .title { font-size: 1.1em; font-weight: bold; color: #e74c3c; margin-bottom: 15px; }
        .loading-info .detail { font-size: 0.8em; color: #aaa; margin: 5px 0; }
        .loading-info .detail span { color: #fff; font-weight: bold; }
        
        /* Barra de buffer */
        .buffer-bar { width: 80%; height: 6px; background: #333; border-radius: 3px; margin: 15px 0; overflow: hidden; }
        .buffer-bar .fill { height: 100%; background: #e74c3c; border-radius: 3px; transition: width 0.5s; }
        
        textarea { width: 100%; height: 80px; padding: 12px; background: #1a1a1a; border: 2px solid #333; border-radius: 8px; color: #fff; font-size: 12px; margin-bottom: 10px; outline: none; }
        textarea:focus { border-color: #e74c3c; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-play { background: #e74c3c; }
        .btn-stop { background: #555; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .stat { background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; }
        .stat .v { color: #e74c3c; font-size: 17px; font-weight: bold; }
        .stat .l { color: #888; font-size: 10px; }
        .status { background: #1a1a1a; padding: 15px; border-radius: 8px; text-align: center; margin-top: 10px; }
        .status .icon { font-size: 2em; }
        .status .msg { font-size: 0.85em; color: #888; margin-top: 8px; line-height: 1.5; }
        .info-row { font-size: 0.75em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header"><h1>🎬 UDP Streaming Player</h1></div>
    
    <div class="player-wrapper">
        <video id="player" controls playsinline crossorigin="anonymous"></video>
        
        <!-- Tela de carregamento -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-info">
                <div class="title" id="loadingTitle">Preparando...</div>
                <div class="buffer-bar"><div class="fill" id="bufferFill" style="width:0%"></div></div>
                <div class="detail">Progresso: <span id="loadProg">0%</span></div>
                <div class="detail">Velocidade: <span id="loadSpeed">0 KB/s</span></div>
                <div class="detail">Peers UDP: <span id="loadPeers">0</span></div>
                <div class="detail" id="loadStatus">Conectando trackers...</div>
            </div>
        </div>
    </div>
    
    <div class="stats">
        <div class="stat"><div class="v" id="prog">0%</div><div class="l">Progresso</div></div>
        <div class="stat"><div class="v" id="speed">0 KB/s</div><div class="l">Velocidade</div></div>
        <div class="stat"><div class="v" id="peers">0</div><div class="l">Peers UDP</div></div>
    </div>
    
    <textarea id="magnet" placeholder="Cole seu magnet link aqui..."></textarea>
    
    <button class="btn-play" onclick="startStream()">▶️ STREAMING UDP</button>
    <button class="btn-stop" onclick="stopStream()">⏹️ Parar</button>
    
    <div class="status" id="status">
        <div class="icon">📂</div>
        <div class="msg">Pronto para streaming UDP nativo<br><span class="info-row">Velocidade limitada a 3 MB/s</span></div>
    </div>

    <script>
        let interval = null;
        let streamStarted = false;
        let buffering = true;
        
        function startStream() {
            const m = document.getElementById('magnet').value.trim();
            if (!m.startsWith('magnet:')) return;
            
            streamStarted = false;
            buffering = true;
            
            // Mostra overlay de carregamento
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingTitle').textContent = 'Conectando trackers UDP...';
            document.getElementById('loadStatus').textContent = 'Iniciando servidor de streaming...';
            
            // Inicia o download
            App.startDownload(m);
            
            // Depois de 6 segundos, conecta ao servidor de streaming
            setTimeout(() => {
                document.getElementById('loadingTitle').textContent = 'Carregando vídeo...';
                document.getElementById('loadStatus').textContent = 'Aguardando primeiros pedaços...';
                
                const url = App.getStreamUrl();
                const player = document.getElementById('player');
                player.src = url;
                player.play().catch(() => {});
                streamStarted = true;
            }, 6000);
            
            // Atualiza stats
            if (interval) clearInterval(interval);
            interval = setInterval(updateStats, 1000);
            
            // Monitora buffer do player
            const player = document.getElementById('player');
            player.addEventListener('waiting', () => {
                buffering = true;
                document.getElementById('loadingOverlay').classList.remove('hidden');
                document.getElementById('loadingTitle').textContent = 'Carregando...';
                document.getElementById('loadStatus').textContent = 'Baixando mais pedaços...';
            });
            player.addEventListener('playing', () => {
                buffering = false;
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
            player.addEventListener('canplay', () => {
                if (streamStarted && player.readyState >= 2) {
                    buffering = false;
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }
            });
        }
        
        function updateStats() {
            const prog = App.getProgress();
            const speed = App.getSpeed();
            const peers = App.getPeers();
            
            document.getElementById('prog').textContent = prog + '%';
            document.getElementById('speed').textContent = speed;
            document.getElementById('peers').textContent = peers;
            
            document.getElementById('loadProg').textContent = prog + '%';
            document.getElementById('loadSpeed').textContent = speed;
            document.getElementById('loadPeers').textContent = peers;
            document.getElementById('bufferFill').style.width = prog + '%';
            
            // Atualiza mensagem de status
            const progNum = parseInt(prog);
            if (progNum < 1) {
                document.getElementById('loadStatus').textContent = 'Conectando a peers UDP...';
            } else if (progNum < 5) {
                document.getElementById('loadStatus').textContent = 'Baixando metadados...';
            } else if (progNum < 15) {
                document.getElementById('loadStatus').textContent = 'Baixando início do vídeo...';
            } else if (buffering) {
                document.getElementById('loadStatus').textContent = 'Baixando mais pedaços...';
            }
            
            document.getElementById('status').innerHTML = 
                '<div class="icon">' + (parseInt(prog) > 0 ? '⏳' : '📂') + '</div>' +
                '<div class="msg">' + speed + ' • ' + peers + ' peers<br>' +
                '<span class="info-row">Limitado a 3 MB/s</span></div>';
        }
        
        function stopStream() {
            streamStarted = false;
            buffering = false;
            document.getElementById('player').pause();
            document.getElementById('player').removeAttribute('src');
            document.getElementById('loadingOverlay').classList.add('hidden');
            if (interval) clearInterval(interval);
            document.getElementById('prog').textContent = '0%';
            document.getElementById('speed').textContent = '0 KB/s';
            document.getElementById('peers').textContent = '0';
            document.getElementById('status').innerHTML = 
                '<div class="icon">⏹️</div><div class="msg">Parado</div>';
        }
    </script>
</body>
</html>
