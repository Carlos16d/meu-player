<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: system-ui, sans-serif; 
            padding: 12px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        .header { 
            text-align: center; 
            padding: 15px 0; 
            border-bottom: 2px solid #e74c3c; 
            margin-bottom: 15px; 
        }
        .header h1 { font-size: 1.3em; color: #e74c3c; }
        video { 
            width: 100%; 
            background: #000; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            aspect-ratio: 16/9; 
        }
        textarea { 
            width: 100%; 
            height: 90px; 
            padding: 12px; 
            background: #1a1a1a; 
            border: 2px solid #333; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 12px; 
            margin-bottom: 10px; 
            outline: none; 
        }
        textarea:focus { border-color: #e74c3c; }
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 8px; 
        }
        .btn-play { background: #e74c3c; }
        .btn-stop { background: #555; }
        .status { 
            background: #1a1a1a; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            margin-top: 10px; 
        }
        .status .icon { font-size: 2.5em; }
        .status .msg { font-size: 0.85em; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="header"><h1>🎬 Meu Player</h1></div>
    
    <video id="player" controls playsinline></video>
    
    <textarea id="magnet" placeholder="Cole seu magnet link aqui..."></textarea>
    
    <button class="btn-play" onclick="download()">▶️ Reproduzir</button>
    <button class="btn-stop" onclick="stop()">⏹️ Parar</button>
    
    <div class="status" id="status">
        <div class="icon">📂</div>
        <div class="msg">Cole um magnet link e clique em Reproduzir</div>
    </div>

    <script>
        function download() {
            const m = document.getElementById('magnet').value.trim();
            if (!m.startsWith('magnet:')) {
                document.getElementById('status').innerHTML = '<div class="icon">❌</div><div class="msg">Magnet link inválido!</div>';
                return;
            }
            
            document.getElementById('status').innerHTML = '<div class="icon">⏳</div><div class="msg">Baixando... Aguarde o vídeo aparecer</div>';
            App.openMagnet(m);
        }
        
        function playVideo(path) {
            document.getElementById('player').src = path;
            document.getElementById('player').play();
            document.getElementById('status').innerHTML = '<div class="icon">▶️</div><div class="msg" style="color:#4ecb71;">Reproduzindo!</div>';
        }
        
        function stop() {
            document.getElementById('player').pause();
            document.getElementById('player').removeAttribute('src');
            document.getElementById('status').innerHTML = '<div class="icon">⏹️</div><div class="msg">Parado</div>';
        }
        
        setInterval(() => {
            const video = App.checkVideo();
            if (video) playVideo(video);
        }, 5000);
    </script>
</body>
</html>
