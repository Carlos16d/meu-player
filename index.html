<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Netflix Icons</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4CAF50">
<meta name="google" content="notranslate">

<link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIk5ldGZsaXggSWNvbnMiLAogICJzaG9ydF9uYW1lIjogIk5ldGZsaXggSWNvbnMiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiM0Q0FGNTAiLAogICJ0aGVtZV9jb2xvciI6ICIjNENBRjUwIgp9">

<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    -webkit-user-select: none; 
    user-select: none; 
  }

  html, body {
    width: 100%; 
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    top: 0; 
    left: 0;
    background: #4CAF50;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .area {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }

  .quadrado {
    width: 110px;
    height: 114px;
    position: absolute;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.5s ease;
  }

  .quadrado img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }

  .legenda {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: white;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    margin-top: 6px;
    padding: 4px 0;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  /* TODOS COMEÇAM NA MESMA POSIÇÃO */
  .verde, .vermelho, .amarelo, .azul { 
    top: 30%; 
    left: 21%; 
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .azul {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }

  /* PASSO 1: Azul vai pra DIREITA, Verde aparece NA POSIÇÃO INICIAL */
  .p1 .azul { 
    top: 30%;
    left: calc(21% + 120px);
    transform: scale(1);
    opacity: 1;
  }
  .p1 .verde { 
    top: 30%;
    left: 21%;
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 9;
    animation: estourar 1.2s ease forwards;
  }

  /* PASSO 2: Azul vai pra BAIXO-DIREITA, Vermelho aparece NA POSIÇÃO ANTERIOR DO AZUL (direita) */
  .p2 .azul { 
    top: calc(30% + 130px);
    left: calc(21% + 120px);
    transform: scale(1);
    opacity: 1;
  }
  .p2 .verde { 
    top: 30%;
    left: 21%;
    transform: scale(1);
    opacity: 1;
    z-index: 9;
  }
  .p2 .vermelho { 
    top: 30%;
    left: calc(21% + 120px);
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 8;
    animation: estourar 1.2s ease forwards;
  }

  /* PASSO 3: Azul vai pra BAIXO-ESQUERDA, Amarelo aparece NA POSIÇÃO ANTERIOR DO AZUL (baixo-direita) */
  .p3 .azul { 
    top: calc(30% + 130px);
    left: 21%;
    transform: scale(1);
    opacity: 1;
  }
  .p3 .verde { 
    top: 30%;
    left: 21%;
    transform: scale(1);
    opacity: 1;
    z-index: 9;
  }
  .p3 .vermelho { 
    top: 30%;
    left: calc(21% + 120px);
    transform: scale(1);
    opacity: 1;
    z-index: 8;
  }
  .p3 .amarelo { 
    top: calc(30% + 130px);
    left: calc(21% + 120px);
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 7;
    animation: estourar 1.2s ease forwards;
  }

  /* ANIMAÇÃO DE ESTOURO */
  @keyframes estourar {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ANIMAÇÃO DE VIBRAÇÃO */
  @keyframes bater {
    0%, 100% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
  }

  .p3 .azul.bater {
    animation: bater 0.1s linear infinite;
  }
</style>
</head>
<body>

<div class="area" id="area">
  <!-- VERDE: Aparece na posição inicial -->
  <div class="quadrado verde" id="verde">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Verde">
    <div class="legenda">Saurabh Subaru</div>
  </div>

  <!-- VERMELHO: Aparece na posição anterior do azul (direita) -->
  <div class="quadrado vermelho" id="vermelho">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Vermelho">
    <div class="legenda">Editar perfil</div>
  </div>

  <!-- AMARELO: Aparece na posição anterior do azul (baixo-direita) -->
  <div class="quadrado amarelo" id="amarelo">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Amarelo">
    <div class="legenda">Editar perfil</div>
  </div>

  <!-- AZUL: Quadrado principal -->
  <div class="quadrado azul" id="azul">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Azul">
    <div class="legenda">Add Profile</div>
  </div>
</div>

<script>
let passo = 0;
const area = document.getElementById('area');
const azul = document.getElementById('azul');

azul.onclick = function() {
  if (passo < 3) {
    passo++;
    area.className = 'area p' + passo;
  } else {
    azul.classList.add('bater');
    setTimeout(function() {
      azul.classList.remove('bater');
    }, 300);
  }
};
</script>

</body>
</html>
