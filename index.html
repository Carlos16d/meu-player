<script>
// Service Worker
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}

// Animação dos quadrados - CÓDIGO SIMPLIFICADO
let passo = 0;
const area = document.getElementById('area');
const azul = document.getElementById('azul');

azul.addEventListener('click', function() {
  console.log('Clicou! Passo: ' + passo);
  
  if (passo < 3) {
    passo++;
    area.className = 'area p' + passo;
    console.log('Mudou para p' + passo);
  } else {
    azul.classList.add('bater');
    console.log('Vibrando!');
    setTimeout(function() {
      azul.classList.remove('bater');
    }, 300);
  }
});

// Previne scroll no mobile
document.body.addEventListener('touchmove', function(e) {
  e.preventDefault();
}, { passive: false });
</script>
