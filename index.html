<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Netflix Icons</title>

<!-- ESSENCIAL: Esconde barra de status -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4CAF50">

<!-- Evitar Google Copy URL -->
<meta name="google" content="notranslate">

<!-- Manifest Inline -->
<link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIk5ldGZsaXggSWNvbnMiLAogICJzaG9ydF9uYW1lIjogIk5ldGZsaXggSWNvbnMiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiM0Q0FGNTAiLAogICJ0aGVtZV9jb2xvciI6ICIjNENBRjUwIgp9">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%; 
    height: 100vh;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
    background: #4CAF50;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  .area {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .quadrado {
    width: 110px;
    height: 114px;
    position: absolute;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .quadrado img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }

  .legenda {
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: white;
    text-align: center;
    white-space: nowrap;
    width: 100%;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  /* TODOS começam escondidos */
  .verde, .vermelho, .amarelo {
    top: 30%;
    left: 21%;
    display: none;
  }

  /* AZUL sempre visível */
  .azul {
    top: 30%;
    left: 21%;
    display: flex;
    z-index: 10;
  }

  /* PASSO 1 */
  .p1 .azul { top: 30%; left: 55%; display: flex; }
  .p1 .verde { top: 30%; left: 21%; display: flex; z-index: 9; }
  .p1 .vermelho { display: none; }
  .p1 .amarelo { display: none; }

  /* PASSO 2 */
  .p2 .azul { top: 60%; left: 55%; display: flex; }
  .p2 .verde { top: 30%; left: 21%; display: flex; z-index: 9; }
  .p2 .vermelho { top: 30%; left: 55%; display: flex; z-index: 8; }
  .p2 .amarelo { display: none; }

  /* PASSO 3 */
  .p3 .azul { top: 60%; left: 21%; display: flex; }
  .p3 .verde { top: 30%; left: 21%; display: flex; z-index: 9; }
  .p3 .vermelho { top: 30%; left: 55%; display: flex; z-index: 8; }
  .p3 .amarelo { top: 60%; left: 55%; display: flex; z-index: 7; }

  /* VIBRAÇÃO */
  @keyframes tremer {
    0%, 100% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
  }

  .bater {
    animation: tremer 0.1s linear infinite;
  }
</style>
</head>
<body>

<div class="area" id="area">
  <!-- VERDE -->
  <div class="quadrado verde" id="verde">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Verde">
    <div class="legenda">Saurabh Subaru</div>
  </div>

  <!-- VERMELHO -->
  <div class="quadrado vermelho" id="vermelho">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Vermelho">
    <div class="legenda">Editar perfil</div>
  </div>

  <!-- AMARELO -->
  <div class="quadrado amarelo" id="amarelo">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Amarelo">
    <div class="legenda">Editar perfil</div>
  </div>

  <!-- AZUL -->
  <div class="quadrado azul" id="azul">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Azul">
    <div class="legenda">Add Profile</div>
  </div>
</div>

<script>
let passo = 0;
const area = document.getElementById('area');
const azul = document.getElementById('azul');

azul.onclick = function() {
  if (passo < 3) {
    passo++;
    area.className = 'area p' + passo;
  } else {
    area.className = 'area p3';
    azul.classList.add('bater');
    setTimeout(function() {
      azul.classList.remove('bater');
    }, 300);
  }
};

// Bloquear Copy URL do Google
window.addEventListener('load', function() {
  if (window.navigator.standalone) {
    console.log('App instalado!');
  }
});
</script>

</body>
</html>
