<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Netflix Client Ultra Full Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .app-container {
            width: 100vw; height: 100vh; 
            background: #121420;
            position: relative; overflow-x: hidden; overflow-y: auto;
            scrollbar-width: none;
        }
        .app-container::-webkit-scrollbar { display: none; }

        .view-section { display: none; width: 100%; height: 100%; position: relative; }
        .view-section.active { display: block; }
        
        #loginScreen.active, #profileScreen.active { display: flex; flex-direction: column; justify-content: center; align-items: center; }

        #loginScreen { padding: 40px 25px; }
        .login-input { width: 100%; padding: 16px; margin-bottom: 16px; background: #1c1c1e; border: 0.5px solid #3a3a3c; border-radius: 8px; color: white; }
        .btn-red { width: 100%; padding: 16px; background: #e50914; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #profileScreen { padding: 40px 20px; }
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-top: 30px; }
        .profile-item { text-align: center; cursor: pointer; position: relative; width: 110px; }
        .avatar-img { width: 110px; height: 110px; border-radius: 11%; font-size: 3.5rem; display: flex; align-items: center; justify-content: center; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .profile-item:active .avatar-img { transform: scale(0.95); }
        .delete-badge { position: absolute; top: -8px; right: -8px; background: #e50914; border-radius: 50%; width: 26px; height: 26px; display: none; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; z-index: 15; cursor: pointer; }
        .managing .delete-badge { display: flex; }
        .btn-manage { margin-top: 45px; background: transparent; color: #8e8e93; border: 1px solid #48484a; padding: 10px 24px; cursor: pointer; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }

        .c1 { background-color: #1b81e6; } .c2 { background-color: #e50914; }
        .c3 { background-color: #2b9d47; } .c4 { background-color: #e67e22; }
        .animated-clone { position: fixed; z-index: 9999; border-radius: 11%; pointer-events: none; transition: all 0.85s cubic-bezier(0.25, 1, 0.5, 1); }

        #homeScreen { overflow-y: auto; height: 100%; scrollbar-width: none; background: #121420; }
        #homeScreen::-webkit-scrollbar { display: none; }
        
        .navbar { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 100; gap: 10px; }
        .nav-left-group { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .icon-n { color: #E50914; font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; cursor: pointer; }
        .search-container { position: relative; display: flex; align-items: center; flex-grow: 1; max-width: 35px; transition: max-width 0.4s; overflow: hidden; }
        .search-container.expanded { max-width: 200px; }
        .search-input { width: 100%; padding: 6px 10px 6px 32px; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); border-radius: 15px; color: #fff; font-size: 0.8rem; outline: none; }
        .search-icon-btn { position: absolute; left: 10px; cursor: pointer; font-size: 0.85rem; z-index: 2; }
        .nav-avatar { width: 35px; height: 35px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #1b81e6; }

        .profile-menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; }
        .profile-menu-overlay.show { display: flex; }
        .profile-menu-card { width: 85%; background: rgba(30,32,42,0.95); backdrop-filter: blur(30px); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.15); position: relative; display: flex; flex-direction: column; gap: 12px; }
        .profile-menu-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; background: rgba(255,255,255,0.1); border-radius: 50%; border: none; color: white; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .profile-menu-header { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .profile-menu-avatar { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .profile-menu-name { font-size: 1.1rem; font-weight: 700; }
        .profile-menu-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; background: rgba(255,255,255,0.03); border: none; color: white; width: 100%; text-align: left; }
        .profile-menu-item:active { background: rgba(255,255,255,0.1); }

        .admin-panel-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 400; display: none; align-items: flex-end; }
        .admin-panel-overlay.show { display: flex; }
        .admin-panel-card { width: 100%; height: 90vh; background: rgba(18,20,35,0.95); backdrop-filter: blur(40px); border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden; }
        .admin-panel-overlay.show .admin-panel-card { transform: translateY(0); }
        .admin-panel-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; margin: 12px auto 8px; flex-shrink: 0; }
        .admin-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 12px; flex-shrink: 0; }
        .admin-panel-title { font-size: 1.1rem; font-weight: 700; }
        .admin-panel-close { width: 32px; height: 32px; background: rgba(255,255,255,0.12); border-radius: 50%; border: none; color: white; cursor: pointer; font-size: 1rem; }
        .admin-panel-body { flex: 1; overflow-y: auto; padding: 10px 15px; }
        .admin-panel-body::-webkit-scrollbar { display: none; }
        .admin-input, .admin-select, .admin-textarea { width: 100%; padding: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; color: white; font-size: 0.75rem; margin-bottom: 8px; outline: none; }
        .admin-textarea { min-height: 60px; resize: vertical; }
        .admin-select { appearance: none; cursor: pointer; }
        .admin-select option { background: #1a1a2e; color: white; }
        .admin-btn { padding: 9px 14px; border-radius: 7px; font-size: 0.73rem; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; margin: 3px 2px; }
        .admin-btn:active { transform: scale(0.95); }
        .admin-btn-primary { background: #1b81e6; color: white; }
        .admin-btn-danger { background: #e50914; color: white; }
        .admin-btn-success { background: #2b9d47; color: white; }
        .admin-btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: white; }
        .admin-btn-sm { padding: 5px 10px; font-size: 0.65rem; border-radius: 5px; }
        .admin-btn-block { width: 100%; justify-content: center; margin-top: 6px; }
        .admin-item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 7px; margin-bottom: 4px; font-size: 0.73rem; gap: 8px; }
        .admin-item-row .item-info { flex: 1; }
        .admin-item-row .item-name { font-weight: 600; color: #ddd; }
        .admin-item-row .item-actions { display: flex; gap: 4px; }

        .torrent-upload-area { border: 2px dashed rgba(255,255,255,0.2); border-radius: 10px; padding: 12px; text-align: center; margin: 8px 0; cursor: pointer; font-size: 0.7rem; color: #888; }
        .torrent-upload-area:active { background: rgba(255,255,255,0.05); }
        .torrent-file-input { display: none; }

        .multi-input-group { margin-bottom: 5px; }
        .multi-input-row { display: flex; gap: 5px; align-items: center; margin-bottom: 3px; }
        .multi-input-row input { flex: 1; }
        .multi-input-row button { flex-shrink: 0; }

        .api-search-section { background: rgba(27,129,230,0.1); border: 1px solid rgba(27,129,230,0.3); border-radius: 10px; padding: 12px; margin: 10px 0; }
        .api-search-section h4 { font-size: 0.8rem; margin-bottom: 8px; color: #6db3f2; }
        .api-search-results { max-height: 250px; overflow-y: auto; margin-top: 5px; }
        .api-result-item { display: flex; gap: 10px; align-items: center; padding: 8px; margin-bottom: 5px; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .api-result-item:active { background: rgba(27,129,230,0.15); border-color: rgba(27,129,230,0.4); }
        .api-result-item img { width: 50px; height: 70px; border-radius: 4px; object-fit: cover; background: #1a1a2e; flex-shrink: 0; }
        .api-result-item .result-info { flex: 1; font-size: 0.68rem; }
        .api-result-item .result-info strong { color: #fff; font-size: 0.73rem; display: block; }
        .result-type { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.55rem; font-weight: 700; margin-top: 2px; }
        .type-movie { background: rgba(27,129,230,0.3); color: #6db3f2; }
        .type-tv { background: rgba(43,157,71,0.3); color: #5ec97a; }
        .api-result-preview { display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        .api-result-preview img { width: 80px; height: 110px; border-radius: 6px; object-fit: cover; background: #1a1a2e; }
        .api-result-info { font-size: 0.7rem; flex: 1; }

        .tab-menu-container { margin-top: 60px; width: 100%; display: flex; padding: 0 20px; height: 30px; z-index: 90; }
        .tab-wrapper { display: flex; gap: 6px; }
        .tab-btn { background: transparent; border: 0.5px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.5); padding: 4px 14px; border-radius: 16px; font-size: 0.7rem; font-weight: 500; cursor: pointer; transition: all 0.5s; height: 26px; line-height: 1; }
        .tab-btn.active-tab { background: white; color: #000; border-color: white; font-weight: 600; }
        .tab-btn.slide-right { transform: translateX(100px); }
        .tab-btn.slide-left { transform: translateX(-55px); }
        .tab-btn.fade-out { opacity: 0; pointer-events: none; }

        .banner-wrapper { padding: 15px; }
        .banner-card { width: 100%; height: 420px; border-radius: 14px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: #1a1e2e; }
        .banner-bg-static { position: absolute; inset: 0; background: linear-gradient(135deg, #2a3050, #141820); z-index: 1; }
        .banner-trailer { position: absolute; inset: 0; object-fit: cover; z-index: 1; opacity: 0.6; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(18,20,32,0.97) 0%, transparent 60%); z-index: 2; }
        .card-brand-n { position: absolute; top: 15px; left: 15px; color: #E50914; font-size: 1.5rem; font-weight: 900; z-index: 3; }
        .banner-content { z-index: 3; text-align: center; }
        .banner-title { font-size: 1.7rem; font-weight: 800; margin-bottom: 5px; }
        .banner-subtitle { font-size: 0.7rem; color: #b0b0b0; margin-bottom: 18px; }
        .banner-controls { display: flex; gap: 8px; justify-content: center; }
        .btn-play-banner { padding: 10px 28px; background: white; color: black; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
        .btn-list-banner { padding: 10px 28px; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

        .carrossel-container { margin: 5px 15px 20px; }
        .carrossel-titulo { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
        .carrossel-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .carrossel-scroll::-webkit-scrollbar { display: none; }
        .carrossel-item { min-width: 120px; height: 170px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; color: white; font-size: 12px; font-weight: 600; padding: 8px; background-size: cover; background-position: center; position: relative; cursor: pointer; }
        .carrossel-item:active { transform: scale(0.95); }
        .carrossel-item-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); border-radius: 6px; z-index: 1; }
        .carrossel-item span { position: relative; z-index: 2; }

        .modal-glass-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.5s; display: flex; align-items: center; justify-content: center; }
        .modal-glass-overlay.ativo { opacity: 1; pointer-events: auto; }
        .modal-glass-card { width: 92%; max-width: 380px; height: 82vh; background: rgba(80,80,80,0.4); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: scale(0.8) translateY(50px); transition: opacity 0.5s, transform 0.5s; overflow: hidden; }
        .modal-glass-overlay.ativo .modal-glass-card { opacity: 1; transform: scale(1) translateY(0); }
        .modal-glass-scroll { flex: 1; overflow-y: auto; }
        .modal-glass-scroll::-webkit-scrollbar { display: none; }
        .modal-trailer-mini { width: 100%; height: 180px; border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; }
        .modal-trailer-mini video { width: 100%; height: 100%; object-fit: cover; }
        .modal-glass-titulo { font-size: 20px; font-weight: 800; text-align: center; }
        .modal-glass-meta { display: flex; gap: 8px; align-items: center; justify-content: center; color: #ccc; font-size: 12px; }
        .modal-glass-classificacao { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 5px; font-weight: 700; }
        .modal-glass-acoes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .modal-glass-btn { padding: 9px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
        .modal-glass-btn-assistir { background: white; color: black; }
        .modal-glass-btn-lista { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .modal-glass-btn-baixar { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .modal-glass-like, .modal-glass-deslike { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .modal-glass-like.ativo { background: rgba(76,175,80,0.5); border-color: #4CAF50; }
        .modal-glass-deslike.ativo { background: rgba(244,67,54,0.5); border-color: #F44336; }
        .modal-abas { display: flex; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .modal-aba-btn { flex: 1; text-align: center; padding: 9px; color: #aaa; font-size: 12px; font-weight: 700; cursor: pointer; border: none; border-bottom: 2px solid transparent; background: none; }
        .modal-aba-btn.ativo { color: white; border-bottom-color: white; }
        .modal-aba-conteudo { display: none; }
        .modal-aba-conteudo.ativo { display: block; }
        .modal-glass-episodios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
        .modal-glass-ep-item { aspect-ratio: 16/9; background-size: cover; border-radius: 6px; display: flex; align-items: flex-end; padding: 4px; color: white; font-size: 9px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden; }
        .modal-glass-ep-item-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%); border-radius: 6px; z-index: 1; }
        .modal-glass-fechar { position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; border: 1px solid rgba(255,255,255,0.3); font-size: 1rem; color: white; }
        .modal-glass-relacionados-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
        .modal-glass-relacionado-item { aspect-ratio: 16/9; background-size: cover; border-radius: 6px; display: flex; align-items: flex-end; padding: 4px; color: white; font-size: 9px; font-weight: 600; position: relative; overflow: hidden; }
        .modal-glass-relacionado-item-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%); border-radius: 6px; z-index: 1; }
        .content-area { padding: 5px 0 40px 0; }

        .player-fullscreen { position: absolute; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .player-fullscreen.show { display: flex; }
        .player-fs-header { padding: 45px 15px 10px; display: flex; justify-content: space-between; align-items: center; }
        .player-fs-close { width: 32px; height: 32px; background: rgba(255,255,255,0.15); border-radius: 50%; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .player-fs-video { flex: 1; width: 100%; object-fit: contain; background: #000; }
        .player-log { padding: 8px 15px; font-size: 0.55rem; color: #6db3f2; background: rgba(27,129,230,0.1); margin: 0 15px 5px; border-radius: 6px; white-space: pre-line; max-height: 150px; overflow-y: auto; line-height: 1.4; }
        .player-fs-info { padding: 10px 15px 25px; }
        .player-fs-info h3 { font-size: 0.95rem; }
        .player-fs-info p { font-size: 0.75rem; color: #aaa; }

        .toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: #2b9d47; color: white; padding: 10px 22px; border-radius: 25px; font-size: 0.8rem; font-weight: 600; z-index: 99999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-container" id="appViewport">
        <div id="loginScreen" class="view-section active">
            <div style="text-align:center;margin-bottom:40px;" class="icon-n">N</div>
            <input type="email" class="login-input" value="user@netflix.com">
            <input type="password" class="login-input" value="••••••">
            <button class="btn-red" onclick="irParaPerfis()">Entrar</button>
        </div>
        <div id="profileScreen" class="view-section">
            <h1 style="font-weight:400;margin-bottom:10px;font-size:1.8rem;">Quem está assistindo?</h1>
            <div class="profile-grid" id="profileGrid"></div>
            <button class="btn-manage" id="manageBtn" onclick="toggleManagement()">Gerenciar Perfis</button>
        </div>
        <div id="homeScreen" class="view-section">
            <nav class="navbar">
                <div class="nav-left-group">
                    <div class="icon-n" onclick="exitToProfiles()">N</div>
                    <div class="search-container" id="searchWrapper">
                        <span class="search-icon-btn" onclick="toggleSearchField()">🔍</span>
                        <input type="text" class="search-input" id="movieSearchInput" placeholder="Buscar..." oninput="filterCatalog(this.value)">
                    </div>
                </div>
                <div class="nav-avatar" id="finalNavAvatar" onclick="openProfileMenu()">🍿</div>
            </nav>
            <div class="tab-menu-container">
                <div class="tab-wrapper">
                    <button class="tab-btn active-tab" id="tabSeries" onclick="handleTabClick('series')">Séries</button>
                    <button class="tab-btn" id="tabFilmes" onclick="handleTabClick('filmes')">Filmes</button>
                    <button class="tab-btn" id="tabCategorias" onclick="handleTabClick('categorias')">Categorias</button>
                </div>
            </div>
            <header class="banner-wrapper">
                <div class="banner-card">
                    <div class="banner-bg-static"></div>
                    <video class="banner-trailer" id="bannerTrailer" loop muted playsinline></video>
                    <div class="banner-overlay"></div>
                    <div class="card-brand-n">N</div>
                    <div class="banner-content">
                        <div class="banner-title" id="bannerTitleDisplay">CARREGANDO...</div>
                        <div class="banner-subtitle" id="bannerSubtitleDisplay"></div>
                        <div class="banner-controls">
                            <button class="btn-play-banner">▶ Assistir</button>
                            <button class="btn-list-banner" id="bannerMyListBtn" onclick="toggleBannerMyList()">+ Minha lista</button>
                        </div>
                    </div>
                </div>
            </header>
            <main class="content-area" id="dynamicRows"></main>
        </div>
        <div class="profile-menu-overlay" id="profileMenuOverlay" onclick="closeProfileMenu()">
            <div class="profile-menu-card" onclick="event.stopPropagation()">
                <button class="profile-menu-close" onclick="closeProfileMenu()">✕</button>
                <div class="profile-menu-header">
                    <div class="profile-menu-avatar c1" id="menuAvatar">🍿</div>
                    <div><div class="profile-menu-name" id="menuName">Lucas</div><div style="font-size:0.7rem;color:#aaa;">user@netflix.com</div></div>
                </div>
                <button class="profile-menu-item" onclick="openAdminPanel()"><span>⚙️</span> Painel Admin</button>
                <button class="profile-menu-item" onclick="gerenciarPerfis()"><span>👤</span> Gerenciar Perfis</button>
                <button class="profile-menu-item" onclick="exitToProfiles()" style="color:#e50914;"><span>🚪</span> Sair</button>
            </div>
        </div>
        <div class="admin-panel-overlay" id="adminPanelOverlay" onclick="closeAdminPanel()">
            <div class="admin-panel-card" onclick="event.stopPropagation()">
                <div class="admin-panel-handle"></div>
                <div class="admin-panel-header">
                    <span class="admin-panel-title">🔧 Painel Admin</span>
                    <button class="admin-panel-close" onclick="closeAdminPanel()">✕</button>
                </div>
                <div class="admin-panel-body">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script>
        const defaultProfiles = [{ id:1,name:'Lucas',color:'c1',face:'🍿' },{ id:2,name:'Convidado',color:'c2',face:'🎬' }];
        let profiles = JSON.parse(localStorage.getItem('nfp')) || defaultProfiles;
        if(!localStorage.getItem('nfp')) localStorage.setItem('nfp',JSON.stringify(profiles));

        const defaultAdminData = {
            banner: { title:'QUARENTÕES EM CRISE', subtitle:'Picante • Irreverente • Comédia', trailerUrl:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
            carousels: [
                { name:'Séries dramáticas', movies:[
                    { title:'TEEN', image:'https://picsum.photos/120/170?random=1', trailerUrl:'', videoUrls:['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'], audioUrls:[], subtitleUrls:[], genre:'Drama', rating:'A14', year:'2024', desc:'', episodes:[
                        { number:1, title:'Episódio 1', duration:'42 min', coverUrl:'', videoUrls:['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'], audioUrls:[], subtitleUrls:[] }
                    ]},
                    { title:'O MENTALISTA', image:'https://picsum.photos/120/170?random=2', trailerUrl:'', videoUrls:[], audioUrls:[], subtitleUrls:[], genre:'Suspense', rating:'A14', year:'2023', desc:'', episodes:[
                        { number:1, title:'Piloto', duration:'45 min', coverUrl:'', videoUrls:['https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'], audioUrls:[], subtitleUrls:[] }
                    ]}
                ]},
                { name:'Em Alta', movies:[{ title:'Destaque 1', image:'https://picsum.photos/120/170?random=31', trailerUrl:'', videoUrls:[], audioUrls:[], subtitleUrls:[], genre:'', rating:'A14', year:'2025', desc:'', episodes:[] }] },
                { name:'Tendências', movies:[] }
            ]
        };

        if(!localStorage.getItem('nfd')) localStorage.setItem('nfd',JSON.stringify(defaultAdminData));
        let adminData = JSON.parse(localStorage.getItem('nfd')) || defaultAdminData;
        function saveAdminData() { localStorage.setItem('nfd',JSON.stringify(adminData)); }
        function toast(m) { const t=document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

        let isManaging=false, activeTab=null, currentGlassMovie=null, bannerHls=null, modalHls=null, playerHls=null;
        let bannerInMyList=false, modalInList=false, currentProfile=profiles[0];
        let currentEditCi=null, currentEditMi=null, currentEpCi=null, currentEpMi=null;
        let currentTorrentClient=null, currentTorrent=null;

        function getPlayerLogText() { const l=document.getElementById('playerLog'); return l?l.innerText:''; }
        function setPlayerLogText(text) { const l=document.getElementById('playerLog'); if(l)l.innerText=text; }
        function appendPlayerLog(text) { setPlayerLogText(getPlayerLogText()+'\n'+text); }

        function irParaPerfis() { document.querySelectorAll('.view-section').forEach(s=>s.classList.remove('active')); document.getElementById('profileScreen').classList.add('active'); renderProfiles(); }
        function initBannerTrailer() { const v=document.getElementById('bannerTrailer'); if(Hls.isSupported()&&!bannerHls){bannerHls=new Hls();bannerHls.loadSource(adminData.banner.trailerUrl);bannerHls.attachMedia(v);bannerHls.on(Hls.Events.MANIFEST_PARSED,()=>{v.muted=true;v.play().catch(()=>{});});} }
        function reloadBannerTrailer(){if(bannerHls){bannerHls.destroy();bannerHls=null;}document.getElementById('bannerTrailer').pause();initBannerTrailer();}
        function toggleBannerMyList(){bannerInMyList=!bannerInMyList;document.getElementById('bannerMyListBtn').innerHTML=bannerInMyList?'✓ Na lista':'+ Minha lista';}
        function showView(id){ document.querySelectorAll('.view-section').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='profileScreen')renderProfiles(); if(id==='homeScreen'){updateBannerDisplay();createCarrosseis();if(!bannerHls)initBannerTrailer();} }

        function renderProfiles(){
            const g=document.getElementById('profileGrid');g.innerHTML='';
            profiles.forEach(p=>g.innerHTML+=`<div class="profile-item"><div class="delete-badge" onclick="deleteProfile(${p.id},event)">✕</div><div class="avatar-img ${p.color}" onclick="handleProfileSelection(${p.id},this.parentNode)">${p.face}</div><p style="margin-top:8px;font-size:0.9rem;color:#fff;">${p.name}</p></div>`);
            if(profiles.length<4&&!isManaging)g.innerHTML+=`<div class="profile-item" onclick="createNewProfile()"><div class="avatar-img" style="background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.3);font-size:2rem;border-radius:11%;">＋</div><p style="margin-top:8px;color:#8e8e93;">Criar</p></div>`;
        }
        function toggleManagement(){isManaging=!isManaging;document.getElementById('manageBtn').innerText=isManaging?'Concluído':'Gerenciar Perfis';document.getElementById('profileScreen').classList.toggle('managing',isManaging);renderProfiles();}
        function createNewProfile(){let n=prompt("Nome:");if(!n)return;profiles.push({id:Date.now(),name:n,color:['c1','c2','c3','c4'][profiles.length%4],face:['🦊','🤖','👾','🦁'][profiles.length%4]});localStorage.setItem('nfp',JSON.stringify(profiles));renderProfiles();}
        function deleteProfile(id,e){e.stopPropagation();profiles=profiles.filter(p=>p.id!==id);localStorage.setItem('nfp',JSON.stringify(profiles));renderProfiles();}

        function handleProfileSelection(id,element){
            if(isManaging)return;
            currentProfile=profiles.find(p=>p.id===id);
            const avatar=element.querySelector('.avatar-img'),rect=avatar.getBoundingClientRect(),targetNav=document.getElementById('finalNavAvatar');
            targetNav.className="nav-avatar";targetNav.innerHTML='';
            const clone=document.createElement('div');clone.className=`animated-clone ${currentProfile.color}`;
            clone.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;display:flex;align-items:center;justify-content:center;font-size:3rem;`;
            clone.innerText=currentProfile.face;document.body.appendChild(clone);
            showView('homeScreen');
            requestAnimationFrame(()=>{
                clone.style.cssText='left:calc(50% - 100px);top:calc(50% - 100px);width:200px;height:200px;font-size:6rem;display:flex;align-items:center;justify-content:center;';
                setTimeout(()=>{const tr=targetNav.getBoundingClientRect();clone.style.cssText=`left:${tr.left}px;top:${tr.top}px;width:${tr.width}px;height:${tr.height}px;font-size:1rem;`;},800);
                setTimeout(()=>{targetNav.className=`nav-avatar ${currentProfile.color}`;targetNav.style.display='flex';targetNav.style.alignItems='center';targetNav.style.justifyContent='center';targetNav.innerText=currentProfile.face;clone.remove();},1600);
            });
        }

        function updateMenuAvatar(){if(currentProfile){document.getElementById('menuAvatar').className=`profile-menu-avatar ${currentProfile.color}`;document.getElementById('menuAvatar').innerText=currentProfile.face;document.getElementById('menuName').innerText=currentProfile.name;}}
        function exitToProfiles(){closeProfileMenu();showView('profileScreen');}
        function gerenciarPerfis(){closeProfileMenu();showView('profileScreen');toggleManagement();}
        function toggleSearchField(){const w=document.getElementById('searchWrapper');w.classList.toggle('expanded');if(w.classList.contains('expanded'))document.getElementById('movieSearchInput').focus();else{document.getElementById('movieSearchInput').value='';}}
        function filterCatalog(q){document.querySelectorAll('.carrossel-item').forEach(c=>{c.style.opacity=c.querySelector('span')?.innerText.toLowerCase().includes(q.toLowerCase().trim())||q===''?'1':'0.2';});}
        function handleTabClick(tt){
            const s=document.getElementById('tabSeries'),f=document.getElementById('tabFilmes'),c=document.getElementById('tabCategorias');
            s.classList.remove('slide-right','slide-left','fade-out','active-tab');f.classList.remove('slide-right','slide-left','fade-out','active-tab');c.classList.remove('fade-out','active-tab');
            if(activeTab===tt){s.classList.add('active-tab');activeTab=null;return;}
            if(tt==='series'){s.classList.add('slide-right','active-tab');f.classList.add('fade-out');c.classList.add('fade-out');activeTab='series';}
            else if(tt==='filmes'){f.classList.add('slide-left','active-tab');s.classList.add('fade-out');c.classList.add('fade-out');activeTab='filmes';}
            else{c.classList.add('active-tab');s.classList.add('fade-out');f.classList.add('fade-out');activeTab='categorias';}
        }

        function updateBannerDisplay(){document.getElementById('bannerTitleDisplay').innerText=adminData.banner.title;document.getElementById('bannerSubtitleDisplay').innerText=adminData.banner.subtitle;}

        function createCarrosseis(){
            const container=document.getElementById('dynamicRows');container.innerHTML='';
            adminData.carousels.forEach(carousel=>{
                const div=document.createElement('div');div.className='carrossel-container';
                let items='';
                carousel.movies.forEach(m=>{items+=`<div class="carrossel-item" style="background-image:url('${m.image}')" onclick="openModalGlass('${m.title.replace(/'/g,"\\'")}')"><div class="carrossel-item-overlay"></div><span>${m.title}</span></div>`;});
                div.innerHTML=`<div class="carrossel-titulo">${carousel.name}</div><div class="carrossel-scroll">${items}</div>`;container.appendChild(div);
            });
        }

        function openProfileMenu(){document.getElementById('profileMenuOverlay').classList.add('show');}
        function closeProfileMenu(){document.getElementById('profileMenuOverlay').classList.remove('show');}

        function openAdminPanel(){closeProfileMenu();document.getElementById('adminPanelOverlay').classList.add('show');populateAll();setupRealtimeSearch();}
        function closeAdminPanel(){document.getElementById('adminPanelOverlay').classList.remove('show');updateBannerDisplay();createCarrosseis();reloadBannerTrailer();}
        function showAdminSection(section){
            document.querySelectorAll('.admin-section-content').forEach(s=>s.style.display='none');
            if(section==='banner'){document.getElementById('sectionBanner').style.display='block';populateBannerFields();}
            else if(section==='carousels'){document.getElementById('sectionCarousels').style.display='block';renderAdminCarousels();}
            else if(section==='addMovie'){document.getElementById('sectionAddMovie').style.display='block';populateMovieSelects();}
            else if(section==='editMovie'){document.getElementById('sectionEditMovie').style.display='block';populateEditSelects();}
            else if(section==='episodes'){document.getElementById('sectionEpisodes').style.display='block';populateEpSelects();}
            else if(section==='backup'){document.getElementById('sectionBackup').style.display='block';}
        }
        function populateAll(){populateBannerFields();renderAdminCarousels();populateMovieSelects();populateEditSelects();populateEpSelects();}
        function populateBannerFields(){document.getElementById('adminBannerTitle').value=adminData.banner.title;document.getElementById('adminBannerSubtitle').value=adminData.banner.subtitle;document.getElementById('adminBannerTrailer').value=adminData.banner.trailerUrl||'';}
        function updateBanner(){adminData.banner.title=document.getElementById('adminBannerTitle').value.trim()||adminData.banner.title;adminData.banner.subtitle=document.getElementById('adminBannerSubtitle').value.trim()||adminData.banner.subtitle;adminData.banner.trailerUrl=document.getElementById('adminBannerTrailer').value.trim()||adminData.banner.trailerUrl;saveAdminData();updateBannerDisplay();reloadBannerTrailer();toast('✅ Banner atualizado!');}
        function renderAdminCarousels(){const list=document.getElementById('adminCarouselList');list.innerHTML='';adminData.carousels.forEach((c,idx)=>list.innerHTML+=`<div class="admin-item-row"><div class="item-info"><span class="item-name">🎠 ${c.name} (${c.movies.length})</span></div><div class="item-actions"><button class="admin-btn admin-btn-outline admin-btn-sm" onclick="moveCarousel(${idx},-1)">⬆</button><button class="admin-btn admin-btn-outline admin-btn-sm" onclick="moveCarousel(${idx},1)">⬇</button><button class="admin-btn admin-btn-outline admin-btn-sm" onclick="renameCarousel(${idx})">✏️</button><button class="admin-btn admin-btn-danger admin-btn-sm" onclick="removeCarousel(${idx})">🗑️</button></div></div>`);}
        function moveCarousel(idx,dir){const n=idx+dir;if(n<0||n>=adminData.carousels.length)return;[adminData.carousels[idx],adminData.carousels[n]]=[adminData.carousels[n],adminData.carousels[idx]];saveAdminData();renderAdminCarousels();createCarrosseis();}
        function addCarousel(){const n=document.getElementById('adminNewCarouselName').value.trim();if(!n)return toast('Digite um nome!');adminData.carousels.push({name:n,movies:[]});document.getElementById('adminNewCarouselName').value='';saveAdminData();renderAdminCarousels();toast('✅ Adicionado!');}
        function renameCarousel(idx){const nn=prompt('Novo nome:',adminData.carousels[idx].name);if(nn?.trim()){adminData.carousels[idx].name=nn.trim();saveAdminData();renderAdminCarousels();createCarrosseis();}}
        function removeCarousel(idx){if(confirm(`Remover "${adminData.carousels[idx].name}"?`)){adminData.carousels.splice(idx,1);saveAdminData();renderAdminCarousels();createCarrosseis();}}

        function populateMovieSelects(){document.getElementById('adminSelectCarousel').innerHTML='<option value="">Escolha um carrossel...</option>'+adminData.carousels.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('');document.getElementById('adminMovieList').innerHTML='';}
        function loadMoviesForEdit(){const ci=parseInt(document.getElementById('adminSelectCarousel').value);const list=document.getElementById('adminMovieList');if(isNaN(ci)){list.innerHTML='';return;}list.innerHTML=`<h4 style="font-size:0.75rem;margin:5px 0;">Filmes (${adminData.carousels[ci].movies.length})</h4>`+adminData.carousels[ci].movies.map((m,i)=>`<div class="admin-item-row"><div class="item-info"><span class="item-name">🎥 ${m.title}</span></div><div class="item-actions"><button class="admin-btn admin-btn-outline admin-btn-sm" onclick="removeMovieFromCarousel(${ci},${i})">🗑️</button></div></div>`).join('');}

        function playMovieEpisode(ci,mi,ei){
            closeModalGlass();
            const movie=adminData.carousels[ci].movies[mi],ep=movie.episodes[ei];
            const epVideos=ep.videoUrls||(ep.videoUrl?[ep.videoUrl]:[]);
            const movieVideos=movie.videoUrls||[];
            const rawUrl=epVideos[0]||movieVideos[0]||adminData.banner.trailerUrl;
            
            document.getElementById('playerFsTitle').innerText=movie.title;
            document.getElementById('playerFsEpName').innerText=ep.title;
            document.getElementById('playerFsEpMeta').innerText=ep.duration;
            document.getElementById('playerFullscreen').classList.add('show');
            
            setPlayerLogText('🔍 Analisando link...');
            
            if (rawUrl.startsWith('magnet:') || rawUrl.includes('btih:')) {
                // 🔥 TENTA USAR O MOTOR NATIVO (LIBTORRENT) PRIMEIRO
                if (typeof TorrentBridge !== 'undefined' && typeof TorrentBridge.playTorrent === 'function') {
                    appendPlayerLog('🚀 Usando motor nativo libtorrent (igual Stremio)');
                    appendPlayerLog('⏳ Iniciando download...');
                    TorrentBridge.playTorrent(rawUrl);
                } else {
                    // Fallback para WebTorrent
                    appendPlayerLog('⚠️ Motor nativo não disponível');
                    appendPlayerLog('🔄 Usando WebTorrent (limitado)...');
                    playTorrentWebFallback(rawUrl);
                }
            } else if (rawUrl.startsWith('torrent:')) {
                playTorrentFromBase64(rawUrl);
            } else if (rawUrl.endsWith('.m3u8')) {
                playHLSStream(rawUrl);
            } else {
                playDirectUrl(rawUrl);
            }
        }

        // Função chamada pelo Java via ponte para atualizar o progresso
        function updateTorrentProgress(progress, speed, peers) {
            const lines = getPlayerLogText().split('\n');
            if (lines.length > 0) {
                lines[lines.length-1] = `📥 ${Math.round(progress)}% | ${speed} KB/s | Peers: ${peers}`;
                setPlayerLogText(lines.join('\n'));
            }
        }

        // Fallback WebTorrent
        function playTorrentWebFallback(magnetUrl) {
            const v = document.getElementById('playerFsVideo');
            
            if (typeof WebTorrent === 'undefined') {
                appendPlayerLog('❌ WebTorrent não disponível');
                return;
            }
            
            if (currentTorrentClient) { currentTorrentClient.destroy(); currentTorrentClient = null; }
            
            appendPlayerLog('⏳ Conectando a peers...');
            
            const wssTrackers = [
                'wss://tracker.openwebtorrent.com',
                'wss://tracker.btorrent.xyz',
                'wss://tracker.files.fm:7073/announce'
            ];
            
            let modifiedMagnet = magnetUrl;
            wssTrackers.forEach(tracker => {
                if (!modifiedMagnet.includes(encodeURIComponent(tracker))) {
                    modifiedMagnet += '&tr=' + encodeURIComponent(tracker);
                }
            });
            
            try {
                currentTorrentClient = new WebTorrent();
                currentTorrentClient.add(modifiedMagnet, (torrent) => {
                    currentTorrent = torrent;
                    appendPlayerLog(`📥 ${torrent.name || 'Torrent'}`);
                    
                    const videoFiles = torrent.files
                        .filter(f => f.name.match(/\.(mp4|mkv|avi|webm|mov)$/i))
                        .sort((a, b) => b.length - a.length);
                    
                    if (videoFiles.length === 0) {
                        appendPlayerLog('❌ Nenhum vídeo encontrado');
                        return;
                    }
                    
                    const videoFile = videoFiles[0];
                    appendPlayerLog(`🎬 ${videoFile.name}`);
                    
                    torrent.on('download', () => {
                        const progress = Math.round(torrent.progress * 100);
                        const speed = torrent.downloadSpeed > 0 ? (torrent.downloadSpeed/1048576).toFixed(1) + ' MB/s' : 'conectando...';
                        updateTorrentProgress(progress, parseInt(torrent.downloadSpeed/1024), torrent.numPeers);
                    });
                    
                    videoFile.renderTo(v, { autoplay: true, controls: true });
                });
            } catch(e) {
                appendPlayerLog('❌ Erro: ' + e.message);
            }
        }

        function playTorrentFromBase64(base64Url) {
            try {
                const base64 = base64Url.replace('torrent:data:application/x-bittorrent;base64,','').replace('torrent:data:application/octet-stream;base64,','');
                const byteString = atob(base64);
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                const blob = new Blob([ab], { type: 'application/x-bittorrent' });
                const blobUrl = URL.createObjectURL(blob);
                appendPlayerLog('📁 Arquivo .torrent carregado');
                playTorrentWebFallback(blobUrl);
            } catch(e) {
                appendPlayerLog('❌ Erro: ' + e.message);
            }
        }

        function playHLSStream(url) {
            const v = document.getElementById('playerFsVideo');
            appendPlayerLog('📡 HLS detectado');
            if (Hls.isSupported()) {
                if (playerHls) playerHls.destroy();
                playerHls = new Hls();
                playerHls.loadSource(url);
                playerHls.attachMedia(v);
                playerHls.on(Hls.Events.MANIFEST_PARSED, () => { appendPlayerLog('✅ Reproduzindo'); v.play().catch(()=>{}); });
            }
        }

        function playDirectUrl(url) {
            const v = document.getElementById('playerFsVideo');
            appendPlayerLog('🎬 Link direto');
            v.src = url;
            v.play().catch(()=>{});
        }

        function closePlayer() {
            document.getElementById('playerFullscreen').classList.remove('show');
            const v = document.getElementById('playerFsVideo');
            v.pause(); v.src = '';
            if (playerHls) { playerHls.destroy(); playerHls = null; }
            if (currentTorrentClient) { currentTorrentClient.destroy(); currentTorrentClient = null; }
            // Avisa o Java para parar o torrent nativo também
            if (typeof TorrentBridge !== 'undefined' && typeof TorrentBridge.stopTorrent === 'function') {
                TorrentBridge.stopTorrent();
            }
            setPlayerLogText('');
        }

        function closeModalGlass(){document.getElementById('modalGlassOverlay').classList.remove('ativo');const v=document.getElementById('modalGlassVideo');v.pause();if(modalHls){modalHls.destroy();modalHls=null;}}
        function switchGlassTab(tab,el){document.querySelectorAll('.modal-aba-btn').forEach(b=>b.classList.remove('ativo'));document.querySelectorAll('.modal-aba-conteudo').forEach(c=>c.classList.remove('ativo'));el.classList.add('ativo');document.getElementById('glassTab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('ativo');}
        function rateGlassMovie(type){if(!currentGlassMovie)return;const s=localStorage.getItem(`glass_${currentGlassMovie}`);document.getElementById('modalGlassLike').classList.remove('ativo');document.getElementById('modalGlassDeslike').classList.remove('ativo');if(s===type)localStorage.removeItem(`glass_${currentGlassMovie}`);else{localStorage.setItem(`glass_${currentGlassMovie}`,type);document.getElementById('modalGlass'+(type==='like'?'Like':'Deslike')).classList.add('ativo');}}
        function toggleModalLista(){modalInList=!modalInList;document.getElementById('modalGlassListaBtn').innerText=modalInList?'✓ Na Lista':'+ Minha Lista';}

        updateMenuAvatar();renderProfiles();
    </script>
</body>
</html>
