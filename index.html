<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Netflix Icons</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">

<!-- Manifest Inline -->
<link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIk5ldGZsaXggSWNvbnMiLAogICJzaG9ydF9uYW1lIjogIk5ldGZsaXggSWNvbnMiLAogICJzdGFydF91cmwiOiAiL25ldGZsaXgtaWNvbnMvIiwKICAic2NvcGUiOiAiL25ldGZsaXgtaWNvbnMvIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAib3JpZW50YXRpb24iOiAicG9ydHJhaXQiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwMDAwMDAiLAogICJ0aGVtZV9jb2xvciI6ICIjMDAwMDAwIiwKICAibGFuZyI6ICJwdC1CUiIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImljb24ucG5nIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgICB9CiAgXQp9">

<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    -webkit-user-select: none; 
    user-select: none; 
  }

  html {
    background: green;
  }

  body {
    width: 100%; 
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0; 
    left: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .area {
    position: relative;
    width: 100vw;
    height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .quadrado {
    width: 110px;
    height: 114px;
    position: absolute;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .quadrado img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    background: linear-gradient(to bottom, rgba(0,0,139,0.7), rgba(173,216,230,0.3));
  }

  .legenda {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: white;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    margin-top: 6px;
    padding: 4px 0;
  }

  /* POSIÇÕES INICIAIS */
  .verde, .vermelho, .amarelo, .azul { 
    top: 30%; 
    left: 21%; 
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s ease;
  }

  .azul {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }

  /* PASSO 1 */
  .p1 .azul { 
    transform: translate(120%, 0px) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .p1 .verde { 
    transform: translate(0px, 0px) scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 9;
  }

  /* PASSO 2 */
  .p2 .azul { 
    transform: translate(120%, 140%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .p2 .verde { 
    transform: translate(0px, 0px) scale(1);
    opacity: 1;
    z-index: 9;
  }
  .p2 .vermelho { 
    transform: translate(120%, 0px) scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 8;
  }

  /* PASSO 3 */
  .p3 .azul { 
    transform: translate(0px, 140%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .p3 .verde { 
    transform: translate(0px, 0px) scale(1);
    opacity: 1;
    z-index: 9;
  }
  .p3 .vermelho { 
    transform: translate(120%, 0px) scale(1);
    opacity: 1;
    z-index: 8;
  }
  .p3 .amarelo { 
    transform: translate(120%, 140%) scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 7;
  }

  /* ANIMAÇÃO DE VIBRAÇÃO */
  @keyframes tremer {
    0%, 100% { transform: translate(0px, 140%) translate(-4px, 0); }
    50% { transform: translate(0px, 140%) translate(4px, 0); }
  }

  .p3 .azul.bater {
    animation: tremer 0.1s linear infinite;
  }
</style>
</head>
<body>

<div class="area" id="area">
  <!-- VERDE -->
  <div class="quadrado verde" id="verde">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Verde">
    <div class="legenda">Saurabh Subaru</div>
  </div>

  <!-- VERMELHO -->
  <div class="quadrado vermelho" id="vermelho">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Vermelho">
    <div class="legenda">Editar perfil</div>
  </div>

  <!-- AMARELO -->
  <div class="quadrado amarelo" id="amarelo">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Amarelo">
    <div class="legenda">Editar perfil</div>
  </div>

  <!-- AZUL -->
  <div class="quadrado azul" id="azul">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Azul">
    <div class="legenda">Add Profile</div>
  </div>
</div>

<script>
let passo = 0;
const area = document.getElementById('area');
const azul = document.getElementById('azul');

azul.onclick = function() {
  if (passo < 3) {
    passo++;
    area.className = 'area p' + passo;
  } else {
    azul.classList.add('bater');
    setTimeout(function() {
      azul.classList.remove('bater');
    }, 300);
  }
};
</script>

</body>
</html>
