<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
    background: black;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .area {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .quadrado {
    width: 110px;
    height: 114px;
    position: absolute;
    cursor: pointer;
    transition: transform 0.5s ease;
  }

  .quadrado img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    background: linear-gradient(to bottom, rgba(0,0,139,0.7), rgba(173,216,230,0.3));
  }

  .legenda {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 19px;
    color: white;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 90%;
    margin-top: 4px;
    padding-top: 4px;
    padding-bottom: 8px;
  }

  .azul, .verde, .vermelho, .amarelo { 
    top: 30%; left: 21%; 
    --tx: 0px; --ty: 0px; 
    transform: translate(var(--tx), var(--ty)) scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .azul {
    transform: translate(var(--tx), var(--ty)) scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }

  .p1 .azul { --tx: 120%; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p1 .verde { --tx: 0px; --ty: 0px; animation: estourar 1.2s ease forwards; z-index: 9; }
  .p2 .azul { --tx: 120%; --ty: 140%; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p2 .verde { --tx: 0px; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 9; }
  .p2 .vermelho { --tx: 120%; --ty: 0px; animation: estourar 1.2s ease forwards; z-index: 8; }
  .p3 .azul { --tx: 0px; --ty: 140%; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p3 .verde { --tx: 0px; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 9; }
  .p3 .vermelho { --tx: 120%; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 8; }
  .p3 .amarelo { --tx: 120%; --ty: 140%; animation: estourar 1.2s ease forwards; z-index: 7; }

  @keyframes estourar {
    0% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    60% { transform: translate(var(--tx), var(--ty)) scale(1.05); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  }

  @keyframes bater {
    0% { transform: translate(var(--tx), var(--ty)) translate(-5px, 0); }
    50% { transform: translate(var(--tx), var(--ty)) translate(5px, 0); }
    100% { transform: translate(var(--tx), var(--ty)) translate(-5px, 0); }
  }

  .bater { animation: bater 0.1s linear infinite !important; }

  /* Botão de download */
  .btn-download {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    color: black;
    border: none;
    padding: 16px 35px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 5px 20px rgba(255,255,255,0.3);
    display: block;
    text-align: center;
    min-width: 200px;
  }

  .btn-download:active {
    transform: translateX(-50%) scale(0.95);
  }

  /* Modal de instruções */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 2000;
    justify-content: center;
    align-items: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: #1a1a1a;
    color: white;
    padding: 30px 25px;
    border-radius: 15px;
    text-align: center;
    max-width: 90%;
    border: 1px solid #333;
  }

  .modal-content h3 {
    margin-bottom: 20px;
    font-size: 20px;
  }

  .modal-content p {
    margin: 15px 0;
    font-size: 15px;
    color: #ccc;
    line-height: 1.5;
  }

  .modal-content .icon {
    font-size: 50px;
    margin: 15px 0;
  }

  .btn-close {
    background: white;
    color: black;
    border: none;
    padding: 12px 40px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div class="area" id="area">
  <div class="quadrado verde" id="verde">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-2fg93funipvqfs9i.webp" alt="Policial">
    <div class="legenda">Saurabh Subaru</div>
  </div>

  <div class="quadrado vermelho" id="vermelho">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-88wkdmjrorckekha.webp" alt="Batman">
    <div class="legenda">Editar bdjdjfperfil</div>
  </div>

  <div class="quadrado amarelo" id="amarelo">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Mulher Maravilha">
    <div class="legenda">Editar perfil</div>
  </div>

  <div class="quadrado azul" id="azul">
    <img src="" alt="Mulher">
    <div class="legenda">Add Profile</div>
  </div>
</div>

<!-- Botão de Download -->
<button class="btn-download" id="btnDownload">📲 Instalar App</button>

<!-- Modal de instruções -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Como Instalar</h3>
    <div id="instrucoes"></div>
    <button class="btn-close" onclick="fecharModal()">OK, Entendi</button>
  </div>
</div>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(
    'self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",e=>e.respondWith(fetch(e.request)));'
  )).catch(() => {});
}

// Detectar sistema operacional
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isAndroid = /Android/.test(navigator.userAgent);
const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);

// Instalação
let deferredPrompt;
const btnDownload = document.getElementById('btnDownload');
const modal = document.getElementById('modal');
const instrucoes = document.getElementById('instrucoes');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnDownload.textContent = '📲 Instalar App';
  btnDownload.style.display = 'block';
});

btnDownload.addEventListener('click', () => {
  if (deferredPrompt) {
    // Tenta instalar automaticamente
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((result) => {
      if (result.outcome === 'accepted') {
        btnDownload.textContent = '✅ Instalado!';
        setTimeout(() => { btnDownload.style.display = 'none'; }, 2000);
      }
      deferredPrompt = null;
    });
  } else {
    // Mostra instruções manuais
    if (isIOS) {
      instrucoes.innerHTML = `
        <div class="icon">📤</div>
        <p><strong>1.</strong> Toque no botão <strong>Compartilhar</strong> (quadrado com seta) na barra inferior do Safari</p>
        <p><strong>2.</strong> Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong></p>
        <p><strong>3.</strong> Toque em <strong>Adicionar</strong> no canto superior direito</p>
        <p style="font-size:13px; color:#999;">⚠️ Importante: Use o navegador <strong>Safari</strong> para instalar</p>
      `;
    } else if (isAndroid) {
      instrucoes.innerHTML = `
        <div class="icon">⋮</div>
        <p><strong>1.</strong> Toque nos <strong>3 pontinhos ⋮</strong> no canto superior direito</p>
        <p><strong>2.</strong> Selecione <strong>"Instalar aplicativo"</strong></p>
        <p><strong>3.</strong> Confirme tocando em <strong>Instalar</strong></p>
      `;
    } else {
      instrucoes.innerHTML = `
        <div class="icon">💻</div>
        <p>No computador, procure o ícone de instalação na barra de endereço do Chrome/Edge</p>
        <p>Ou acesse pelo celular para instalar como app</p>
      `;
    }
    modal.classList.add('active');
  }
});

function fecharModal() {
  modal.classList.remove('active');
}

// Verifica se já está instalado
window.addEventListener('appinstalled', () => {
  btnDownload.textContent = '✅ Instalado!';
  setTimeout(() => { btnDownload.style.display = 'none'; }, 2000);
});

// Quadrados
let passo = 0;
const area = document.getElementById('area');
document.getElementById('azul').addEventListener('click', function(e) {
  e.stopPropagation();
  if (passo < 3) { 
    passo++; 
    area.className = 'area p' + passo; 
  } else {
    this.classList.add('bater');
    setTimeout(() => this.classList.remove('bater'), 300);
  }
});

// Previne scroll
document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
</script>

</body>
</html>
