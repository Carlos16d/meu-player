<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Netflix Icons</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #4CAF50;
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* OCUPA TUDO NO FIREFOX */
    height: 100vh;
    width: 100vw;
    min-height: -moz-available;
    min-height: 100vh;
    
    overflow: hidden;
    position: relative;
    padding: 0 !important;
    margin: 0 !important;
  }

  /* QUADRADO ARRASTÁVEL */
  .quadrado-arrastavel {
    position: absolute;
    top: 0px;  
    left: 0px; 
    width: 100%;
    height: 120px;
    background: red;
    border: 3px solid white;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    font-family: sans-serif;
    touch-action: none;
    user-select: none;
  }

  .area {
    position: relative;
    width: 90vw;
    height: 90vw;
    max-width: 650px;
    max-height: 650px;
    margin-top: 120px;
  }

  .quadrado {
    width: 29.45%;
    height: 30%;
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    cursor: pointer;
    transition: transform 0.5s ease;
  }

  .quadrado::before {
    content: "";
    padding-top: 100%;
  }

  .quadrado img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }

  .legenda {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    font-family: sans-serif;
    font-size: 19px;
    color: white;
    text-align: center;
    white-space: nowrap;
    width: 90%;
    margin-top: 4px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .azul, .verde, .vermelho, .amarelo { 
    top: -10%; 
    left: 17%; 
    --tx: 0px; 
    --ty: 0px; 
    transform: translate(var(--tx), var(--ty)) scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .azul {
    transform: translate(var(--tx), var(--ty)) scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }

  .p1 .azul { --tx: 120%; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p1 .verde { --tx: 0px; --ty: 0px; animation: estourar 1.2s ease forwards; z-index: 9; }

  .p2 .azul { --tx: 120%; --ty: 140%; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p2 .verde { --tx: 0px; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 9; }
  .p2 .vermelho { --tx: 120%; --ty: 0px; animation: estourar 1.2s ease forwards; z-index: 8; }

  .p3 .azul { --tx: 0px; --ty: 140%; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p3 .verde { --tx: 0px; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 9; }
  .p3 .vermelho { --tx: 120%; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 8; }
  .p3 .amarelo { --tx: 120%; --ty: 140%; animation: estourar 1.2s ease forwards; z-index: 7; }

  @keyframes estourar {
    0% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    60% { transform: translate(var(--tx), var(--ty)) scale(1.05); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  }

  @keyframes bater {
    0% { transform: translate(var(--tx), var(--ty)) translate(-5px, 0); }
    50% { transform: translate(var(--tx), var(--ty)) translate(5px, 0); }
    100% { transform: translate(var(--tx), var(--ty)) translate(-5px, 0); }
  }

  .bater { animation: bater 0.1s linear infinite !important; }
</style>
</head>
<body>

<div class="quadrado-arrastavel" id="arrastavel">🔴 FIREFOX - TELA CHEIA 🔴</div>

<div class="area" id="area">
  <div class="quadrado verde" id="verde">
    <img src="img1.jpg" alt="Policial">
    <div class="legenda">Saurabh Subaru</div>
  </div>

  <div class="quadrado vermelho" id="vermelho">
    <img src="img2.jpg" alt="Batman">
    <div class="legenda">Editar perfil</div>
  </div>

  <div class="quadrado amarelo" id="amarelo">
    <img src="img3.jpg" alt="Mulher Maravilha">
    <div class="legenda">Editar perfil</div>
  </div>

  <div class="quadrado azul" id="azul">
    <img src="img4.jpg" alt="Add Profile">
    <div class="legenda">Add Profile</div>
  </div>
</div>

<script>
let passo = 0;
const area = document.getElementById('area');
const azul = document.getElementById('azul');
const elem = document.getElementById('arrastavel');

let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

elem.onmousedown = dragMouseDown;
elem.ontouchstart = dragTouchStart;

function dragMouseDown(e) {
  e = e || window.event;
  e.preventDefault();
  pos3 = e.clientX;
  pos4 = e.clientY;
  document.onmouseup = closeDragElement;
  document.onmousemove = elementDrag;
}

function dragTouchStart(e) {
  e = e || window.event;
  pos3 = e.touches[0].clientX;
  pos4 = e.touches[0].clientY;
  document.ontouchend = closeDragElement;
  document.ontouchmove = elementDragTouch;
}

function elementDrag(e) {
  e = e || window.event;
  e.preventDefault();
  pos1 = pos3 - e.clientX;
  pos2 = pos4 - e.clientY;
  pos3 = e.clientX;
  pos4 = e.clientY;
  elem.style.top = (elem.offsetTop - pos2) + "px";
  elem.style.left = (elem.offsetLeft - pos1) + "px";
}

function elementDragTouch(e) {
  pos1 = pos3 - e.touches[0].clientX;
  pos2 = pos4 - e.touches[0].clientY;
  pos3 = e.touches[0].clientX;
  pos4 = e.touches[0].clientY;
  elem.style.top = (elem.offsetTop - pos2) + "px";
  elem.style.left = (elem.offsetLeft - pos1) + "px";
}

function closeDragElement() {
  document.onmouseup = null;
  document.onmousemove = null;
  document.ontouchend = null;
  document.ontouchmove = null;
}

// TENTATIVA FORTE DE ABRIR EM TELA CHEIA AUTOMATICAMENTE
function entrarFullscreen() {
  const doc = document.documentElement;
  
  // Comando específico do Firefox
  if (doc.mozRequestFullScreen) {
    doc.mozRequestFullScreen();
  } 
  // Comando padrão
  else if (doc.requestFullscreen) {
    doc.requestFullscreen();
  }
}

// Tenta várias vezes assim que abrir
window.onload = () => {
  entrarFullscreen();
  setTimeout(entrarFullscreen, 100);
  setTimeout(entrarFullscreen, 300);
  setTimeout(entrarFullscreen, 500);
};

azul.addEventListener('click', () => {
  if (passo < 3) {
    passo++;
    area.className = 'area p' + passo;
  } else {
    azul.classList.add('bater');
    setTimeout(() => azul.classList.remove('bater'), 300);
  }
});
</script>

</body>
</html>
