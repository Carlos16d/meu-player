<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
    background: black;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .area {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .quadrado {
    width: 110px;
    height: 114px;
    position: absolute;
    cursor: pointer;
    transition: transform 0.5s ease;
  }

  .quadrado img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    background: linear-gradient(to bottom, rgba(0,0,139,0.7), rgba(173,216,230,0.3));
  }

  .legenda {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    font-family: sans-serif;
    font-size: 19px;
    color: white;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 90%;
    margin-top: 4px;
    padding-top: 4px;
    padding-bottom: 8px;
  }

  .azul, .verde, .vermelho, .amarelo { 
    top: 30%; left: 21%; 
    --tx: 0px; --ty: 0px; 
    transform: translate(var(--tx), var(--ty)) scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .azul {
    transform: translate(var(--tx), var(--ty)) scale(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }

  .p1 .azul { --tx: 120%; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p1 .verde { --tx: 0px; --ty: 0px; animation: estourar 1.2s ease forwards; z-index: 9; }
  .p2 .azul { --tx: 120%; --ty: 140%; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p2 .verde { --tx: 0px; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 9; }
  .p2 .vermelho { --tx: 120%; --ty: 0px; animation: estourar 1.2s ease forwards; z-index: 8; }
  .p3 .azul { --tx: 0px; --ty: 140%; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  .p3 .verde { --tx: 0px; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 9; }
  .p3 .vermelho { --tx: 120%; --ty: 0px; transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; z-index: 8; }
  .p3 .amarelo { --tx: 120%; --ty: 140%; animation: estourar 1.2s ease forwards; z-index: 7; }

  @keyframes estourar {
    0% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    60% { transform: translate(var(--tx), var(--ty)) scale(1.05); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  }

  @keyframes bater {
    0% { transform: translate(var(--tx), var(--ty)) translate(-5px, 0); }
    50% { transform: translate(var(--tx), var(--ty)) translate(5px, 0); }
    100% { transform: translate(var(--tx), var(--ty)) translate(-5px, 0); }
  }

  .bater { animation: bater 0.1s linear infinite !important; }

  .btn-download {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: #fff;
    color: #000;
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<div class="area" id="area">
  <div class="quadrado verde" id="verde">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-2fg93funipvqfs9i.webp" alt="Policial">
    <div class="legenda">Saurabh Subaru</div>
  </div>

  <div class="quadrado vermelho" id="vermelho">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-88wkdmjrorckekha.webp" alt="Batman">
    <div class="legenda">Editar bdjdjfperfil</div>
  </div>

  <div class="quadrado amarelo" id="amarelo">
    <img src="https://wallpapers.com/images/high/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.webp" alt="Mulher Maravilha">
    <div class="legenda">Editar perfil</div>
  </div>

  <div class="quadrado azul" id="azul">
    <img src="" alt="Mulher">
    <div class="legenda">Add Profile</div>
  </div>
</div>

<button class="btn-download" id="btnDownload">📱 Baixar App</button>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}

// Instalação
let deferredPrompt;
const btn = document.getElementById('btnDownload');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btn.textContent = '📱 Baixar App';
  btn.style.display = 'block';
});

btn.addEventListener('click', () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r => {
      if (r.outcome === 'accepted') btn.textContent = '✅ Instalado!';
      deferredPrompt = null;
    });
  }
});

// Quadrados
let passo = 0;
const area = document.getElementById('area');
document.getElementById('azul').addEventListener('click', function(e) {
  e.stopPropagation();
  if (passo < 3) { passo++; area.className = 'area p' + passo; }
  else {
    this.classList.add('bater');
    setTimeout(() => this.classList.remove('bater'), 300);
  }
});
</script>

</body>
</html>
